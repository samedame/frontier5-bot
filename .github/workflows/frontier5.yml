name: frontier5

on:
  schedule:
    # 21:30 UTC, Mon-Fri = 4:30pm EST / 5:30pm EDT: after the US close in both seasons.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "close = final-close run (default). preclose = provisional run while the session is open"
        type: choice
        options: [close, preclose]
        default: close
      scheduled_for_et:
        description: "HH:MM ET the scheduler targeted (sent by open-scheduler)"
        required: false
        default: ""
      trigger:
        description: "who started this run (cf-scheduler or manual)"
        required: false
        default: "manual"
      status:
        description: "Also send the full status message"
        type: boolean
        default: false
      force:
        description: "Process the latest bar even if it was already processed"
        type: boolean
        default: false

permissions:
  contents: write  # the job commits state/state.json back to the repo

concurrency:
  group: frontier5
  cancel-in-progress: false

jobs:
  signals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run FRONTIER-5
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FRONTIER5_ACCOUNT_USD: ${{ vars.FRONTIER5_ACCOUNT_USD }}
          FRONTIER5_SHADOW: ${{ vars.FRONTIER5_SHADOW }}
          FRONTIER5_ENABLED: ${{ vars.FRONTIER5_ENABLED }}
          FRONTIER5_A_BAND: ${{ vars.FRONTIER5_A_BAND }}
          FRONTIER5_FRACTIONAL: ${{ vars.FRONTIER5_FRACTIONAL }}
        run: |
          python -m frontier5.run \
            --mode "${{ inputs.mode || 'close' }}" \
            --trigger "${{ inputs.trigger || github.event_name }}" \
            --scheduled-for-et "${{ inputs.scheduled_for_et }}" \
            ${{ inputs.status && '--status' || '' }} \
            ${{ inputs.force && '--force' || '' }}

      - name: Commit state
        run: |
          git config user.name "frontier5-bot"
          git config user.email "frontier5-bot@users.noreply.github.com"
          git add state/state.json
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
